name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Test on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  msrv:
    name: Minimum supported Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets

  desktop:
    name: Desktop smoke test
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: macos-latest
            name: macOS
    runs-on: ${{ matrix.os }}
    env:
      CLAUDE_FLASH_HOME: ${{ github.workspace }}/.flash-home
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - name: Start the agent with its native front end
        shell: bash
        run: |
          mkdir -p "$CLAUDE_FLASH_HOME"
          target/release/flash agent start
          target/release/flash status
      - name: Show every signal and check the agent survives it
        shell: bash
        run: |
          target/release/flash test
          target/release/flash status --json > status.json
          cat status.json
          grep -q '"flashes": 4' status.json
      - name: Screenshot a flash (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;
          public static class Capture {
              [DllImport("user32.dll")] static extern bool SetProcessDPIAware();
              [DllImport("user32.dll")] static extern int GetSystemMetrics(int index);
              [DllImport("user32.dll")] static extern IntPtr GetDC(IntPtr hwnd);
              [DllImport("user32.dll")] static extern int ReleaseDC(IntPtr hwnd, IntPtr hdc);
              [DllImport("gdi32.dll")] static extern IntPtr CreateCompatibleDC(IntPtr hdc);
              [DllImport("gdi32.dll")] static extern IntPtr CreateCompatibleBitmap(IntPtr hdc, int w, int h);
              [DllImport("gdi32.dll")] static extern IntPtr SelectObject(IntPtr hdc, IntPtr obj);
              [DllImport("gdi32.dll")] static extern bool BitBlt(IntPtr dst, int x, int y, int w, int h, IntPtr src, int sx, int sy, uint rop);
              [DllImport("gdi32.dll")] static extern bool DeleteDC(IntPtr hdc);
              public static IntPtr Screen() {
                  SetProcessDPIAware();
                  int x = GetSystemMetrics(76), y = GetSystemMetrics(77), w = GetSystemMetrics(78), h = GetSystemMetrics(79);
                  IntPtr screen = GetDC(IntPtr.Zero);
                  IntPtr mem = CreateCompatibleDC(screen);
                  IntPtr bitmap = CreateCompatibleBitmap(screen, w, h);
                  IntPtr old = SelectObject(mem, bitmap);
                  // CAPTUREBLT includes layered windows, which is what the overlay is.
                  BitBlt(mem, 0, 0, w, h, screen, x, y, 0x00CC0020 | 0x40000000);
                  SelectObject(mem, old);
                  DeleteDC(mem);
                  ReleaseDC(IntPtr.Zero, screen);
                  return bitmap;
              }
          }
          '@
          Start-Process -FilePath target/release/flash.exe -ArgumentList 'test', 'approval'
          Start-Sleep -Milliseconds 400
          [System.Drawing.Image]::FromHbitmap([Capture]::Screen()).Save("$PWD/flash-windows.png", [System.Drawing.Imaging.ImageFormat]::Png)
      - name: Screenshot a flash (macOS)
        if: runner.os == 'macOS'
        continue-on-error: true
        run: |
          target/release/flash test approval &
          sleep 0.35
          screencapture -x flash-macos.png
      - name: Stop the agent
        if: always()
        shell: bash
        run: |
          target/release/flash agent stop || true
          cat "$CLAUDE_FLASH_HOME/agent.log" || true
      - name: Remove the login items key (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        # Some profiles have never had this key, and the installer has to create it.
        run: Remove-Item -Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' -Recurse -Force -ErrorAction SilentlyContinue
      - name: Install and uninstall as a user would
        shell: bash
        run: |
          set -euxo pipefail
          unset CLAUDE_FLASH_HOME
          mkdir -p ~/.claude
          target/release/flash install
          target/release/flash status
          target/release/flash uninstall --purge
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: flash-${{ matrix.name }}
          path: |
            flash-*.png
            status.json
          if-no-files-found: ignore

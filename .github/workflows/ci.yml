name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Test on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  msrv:
    name: Minimum supported Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets

  desktop:
    name: Flash on a real ${{ matrix.name }} desktop
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: macos-latest
            name: macOS
    runs-on: ${{ matrix.os }}
    env:
      CLAUDE_FLASH_HOME: ${{ github.workspace }}/.flash-home
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - name: Start the agent with its native front end
        shell: bash
        run: |
          mkdir -p "$CLAUDE_FLASH_HOME"
          target/release/flash agent start
          target/release/flash status
      - name: Show every signal and check the agent survives it
        shell: bash
        run: |
          target/release/flash test
          target/release/flash status --json > status.json
          cat status.json
          grep -q '"flashes": 4' status.json
      - name: Screenshot a flash (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing, System.Windows.Forms
          Start-Process -FilePath target/release/flash.exe -ArgumentList 'test', 'approval'
          Start-Sleep -Milliseconds 350
          $bounds = [System.Windows.Forms.SystemInformation]::VirtualScreen
          $bitmap = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
          $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
          # CaptureBlt includes layered windows, which is what the overlay is.
          $op = [System.Drawing.CopyPixelOperation]::SourceCopy -bor [System.Drawing.CopyPixelOperation]::CaptureBlt
          $graphics.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size, $op)
          $bitmap.Save("$PWD/flash-windows.png", [System.Drawing.Imaging.ImageFormat]::Png)
      - name: Screenshot a flash (macOS)
        if: runner.os == 'macOS'
        continue-on-error: true
        run: |
          target/release/flash test approval &
          sleep 0.35
          screencapture -x flash-macos.png
      - name: Stop the agent
        if: always()
        shell: bash
        run: |
          target/release/flash agent stop || true
          cat "$CLAUDE_FLASH_HOME/agent.log" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flash-${{ matrix.name }}
          path: |
            flash-*.png
            status.json
          if-no-files-found: ignore

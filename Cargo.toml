[workspace]
resolver = "3"
members = ["crates/flash-core", "crates/claude-flash"]

[workspace.package]
version = "2.2.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/anish-agr/claude-flash"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "1.1"
clap = { version = "4.6", features = ["derive"] }
clap_complete = "4.6"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"

[profile.release]
lto = true
codegen-units = 1
strip = true

  - DocumentLabel: Configuration
    DocumentUrl: https://github.com/anish-agr/claude-flash/blob/main/docs/configuration.md
InstallationNotes: |-
  Run `flash install` to add the Claude Code hooks and start the agent, now and at
  every login. Restart any Claude Code session that is already open. Before
  `winget uninstall`, run `flash uninstall` to take the hooks out again.

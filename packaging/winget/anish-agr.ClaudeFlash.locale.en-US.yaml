ShortDescription: Screen flashes when Claude Code finishes, asks, needs approval or fails
Description: |-
  Claude Flash watches Claude Code through its hooks and flashes the edge of every
  screen when a session finishes a turn, asks a question, needs approval, or hits an
  error. Each signal has its own colour, so a glance tells you which one it is
  without reading the terminal. A tray icon turns flashes on and off, `flash log`
  says what became of every signal, and settings live in one TOML file.
Moniker: claude-flash
